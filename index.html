<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101215" />
    <meta
      name="description"
      content="MAX TIME — тренировки, питание и прогресс. Личный журнал с сохранением на устройстве."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>MAX TIME — тренировки и прогресс</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./app/app.css" />
    <link rel="stylesheet" href="./app/refinement.css" />
    <script type="module" src="./app/main.mjs"></script>
  </head>
  <body>
    <div id="error-bar" class="error-bar" role="alert" hidden>
      <span></span
      ><button
        class="icon-button"
        data-action="dismiss-error"
        aria-label="Закрыть уведомление"
      >
        ×
      </button>
    </div>
    <button
      id="update-app"
      class="button primary update-button"
      data-action="update-app"
      hidden
    >
      Доступно обновление
    </button>
    <div id="app">
      <main class="app-main recovery-screen">
        <h1>MAX TIME</h1>
        <p>Открываю журнал…</p>
        <noscript>Для работы журнала включите JavaScript в браузере.</noscript>
      </main>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>

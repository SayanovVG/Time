<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101215" />
    <meta name="description" content="MAX TIME — тренировки, питание и прогресс. Личный журнал с сохранением на устройстве." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>MAX TIME — тренировки и прогресс</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./app/app.css" />
    <link rel="stylesheet" href="./app/refinement.css" />
    <link rel="stylesheet" href="./app/design.css" />
    <script type="module" src="./app/main.mjs"></script>
    <style>
      #mt-intro{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#25303b 0,#121820 45%,#0d1117 100%);transition:opacity .28s ease,visibility .28s ease}
      #mt-intro.out{opacity:0;visibility:hidden;pointer-events:none}
      .mt-splash{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;animation:mt-in .42s ease-out both}
      .mt-splash img{width:82px;height:82px;border-radius:22px;box-shadow:0 20px 55px #0008}
      .mt-splash strong{font:760 21px/1.2 Manrope,system-ui,sans-serif;letter-spacing:.055em;color:#f6f1ec;margin-top:10px}
      .mt-splash span{font:600 12px/1.5 Manrope,system-ui,sans-serif;letter-spacing:.09em;color:#9eadbb}
      .mt-splash i{display:block;width:80px;height:3px;border-radius:10px;background:linear-gradient(90deg,#f7c79d,#f58e58)}
      @keyframes mt-in{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
      @media(prefers-reduced-motion:reduce){#mt-intro,.mt-splash{animation:none!important;transition:none!important}}
    </style>
  </head>
  <body>
    <div id="mt-intro" aria-hidden="true"><div class="mt-splash"><img src="./icon.svg" width="82" height="82" alt=""><strong>MAX TIME</strong><i></i><span>Тренировки · Питание · Прогресс</span></div></div>
    <div id="error-bar" class="error-bar" role="alert" hidden>
      <span></span><button class="icon-button" data-action="dismiss-error" aria-label="Закрыть уведомление">×</button>
    </div>
    <button id="update-app" class="button primary update-button" data-action="update-app" hidden>Доступно обновление</button>
    <div id="app">
      <main class="app-main recovery-screen">
        <h1>MAX TIME</h1>
        <p>Открываю журнал…</p>
        <noscript>Для работы журнала включите JavaScript в браузере.</noscript>
      </main>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <script>
      addEventListener("DOMContentLoaded", () => {
        const intro = document.getElementById("mt-intro");
        if (!intro) return;
        const delay = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 420;
        setTimeout(() => {
          intro.classList.add("out");
          setTimeout(() => intro.remove(), 320);
        }, delay);
      }, {once: true});
    </script>
  </body>
</html>

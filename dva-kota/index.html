function setupJoy(el){const p=+el.dataset.p,knob=el.querySelector('.knob');let id=null;const move=e=>{if(e.pointerId!==id)return;const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=r.width*.32,len=Math.hypot(dx,dy)||1,s=Math.min(1,max/len),x=dx*s;knob.style.transform=`translate(${x}px,${dy*s}px)`;input[p].move=Math.max(-1,Math.min(1,dx/max))};el.onpointerdown=e=>{id=e.pointerId;el.setPointerCapture(id);move(e)};el.onpointermove=move;const end=e=>{if(e.pointerId!==id)return;id=null;input[p].move=0;knob.style.transform='translate(0,0)'};el.onpointerup=end;el.onpointercancel=end}document.querySelectorAll('.joy').forEach(setupJoy);document.querySelectorAll('.jump').forEach(b=>{const p=+b.dataset.p;b.onpointerdown=e=>{e.preventDefault();input[p].jump=true;b.classList.add('on')};const up=e=>{e.preventDefault();input[p].jump=false;b.classList.remove('on')};b.onpointerup=up;b.onpointercancel=up;b.onpointerleave=up});document.querySelectorAll('.skill').forEach(b=>{const p=+b.dataset.p;b.onpointerdown=e=>{e.preventDefault();input[p].skill=true;b.classList.add('on')};const up=e=>{e.preventDefault();input[p].skill=false;b.classList.remove('on')};b.onpointerup=up;b.onpointercancel=up;b.onpointerleave=up});

function resetPlayer(p,i,why='Упс!'){if(abilityStage(p)>=4&&p.shield){p.shield=false;showMsg(`${p.name}: сработала «9 жизней»! ✨`,1200);sparkle();p.x=Math.max(cameraX+130,100+i*65);p.y=260;p.vx=0;p.vy=0;return}showMsg(`${why} ${p.name} вернулся на безопасную полку`,900);p.x=Math.max(cameraX+130,100+i*65);p.y=250;p.vx=0;p.vy=0}
function updatePlayer(p,i,dt,inpt){p.dashCd=Math.max(0,p.dashCd-dt);const stage=abilityStage(p),max=stage>=2?380:330,acc=1750;if(Math.abs(inpt.move)>.06){p.vx+=inpt.move*acc*dt;p.dir=Math.sign(inpt.move)}else p.vx*=Math.pow(.80,dt*60);p.vx=Math.max(-max,Math.min(max,p.vx));if(inpt.jump&&!p._jumpLatch){const maxJ=stage>=1?2:1;if(p.on||p.jumps<maxJ){p.vy=-680;p.on=false;p.jumps++;if(Math.random()<.22)meow(i)}}p._jumpLatch=inpt.jump;if(inpt.skill&&!p._skillLatch&&stage>=3&&p.dashCd<=0){p.vx=p.dir*720;p.vy=Math.min(p.vy,-120);p.dashCd=4;showMsg(`${p.name}: РЫВОК! 🐾`,500);tone(300,.14,'sawtooth',.09,0,700)}p._skillLatch=inpt.skill;p.vy=Math.min(1050,p.vy+gravity*dt);p.x+=p.vx*dt;p.x=Math.max(0,Math.min(worldW-p.w,p.x));for(const pl of platforms){if(rect(p,pl)){if(p.vx>0)p.x=pl.x-p.w;else if(p.vx<0)p.x=pl.x+pl.w;p.vx=0}}p.y+=p.vy*dt;p.on=false;for(const pl of platforms){if(rect(p,pl)){if(p.vy>0){p.y=pl.y-p.h;p.vy=0;p.on=true;p.jumps=0}else if(p.vy<0){p.y=pl.y+pl.h;p.vy=0}}}for(const h of hazards){if(rect(p,h)){p.vx*=.86;if(h.type==='slime')p.vy-=40}}if(p.y>900)resetPlayer(p,i,'Мимо полки!')}
function update(dt){let i0=input[0],i1=input[1];if(gameMode==='host')i1=remoteInput;updatePlayer(players[0],0,dt,i0);updatePlayer(players[1],1,dt,i1);for(const it of pickups){if(it.taken)continue;it.bob+=dt*4;const rr={x:it.x-20,y:it.y-22+Math.sin(it.bob)*5,w:40,h:40};for(let i=0;i<2;i++){const p=players[i];if(rect(p,rr)){it.taken=true;if(it.type==='key'){keysGot++;sparkle();showMsg('Ключ найден! 🔑',650)}else{collected++;const before=abilityStage(p);p.food++;if(it.type==='mouse')squeak();else fishSound();if(Math.random()<.13)meow(i);checkUnlock(p,before)}updateTask();updateStats();break}}}if(dog){dog.speed+=dt*(goalType==='boss'?2.2:1.4);dog.x+=dog.speed*dt;const back=Math.min(players[0].x,players[1].x);if(dog.x+72>back){bark();let victim=players[0].x<players[1].x?0:1,p=players[victim];if(abilityStage(p)>=4&&p.shield){p.shield=false;dog.x-=250;showMsg(`${p.name}: Барбос промахнулся — «9 жизней»!`,1200);sparkle()}else{showMsg('Барбос догнал кота! 🐶',900);setTimeout(()=>loadLevel(levelIndex),500);return}}}const need=goalType==='keys'?keysGot>=keysRequired:goalType==='collect'?collected>=required:true;if(need&&players.every(p=>p.x>finishX-120))completeLevel();const center=(players[0].x+players[1].x)/2;cameraX+=(Math.max(0,Math.min(worldW-V.w,center-V.w*.43))-cameraX)*Math.min(1,dt*4.4);if(dog)cameraX=Math.max(cameraX,Math.max(0,dog.x-110));if(gameMode==='host'){sendTimer+=dt;if(sendTimer>.05){sendTimer=0;sendState()}}}
function completeLevel(){if(transitioning)return;transitioning=true;sparkle();if(levelIndex===19){running=false;showWin();return}unlocked=Math.max(unlocked,levelIndex+2);localStorage.setItem('twoCatsSaveV2',JSON.stringify({unlocked,food:[players[0].food,players[1].food]}));showMsg('Уровень пройден! ⭐',800);setTimeout(()=>loadLevel(levelIndex+1),850)}
function themePalette(t){const m={petshop:['#8bd8ff','#eefaff','#d6b78c'],aquarium:['#4ca9cc','#dff8ff','#4d91a9'],toys:['#ef9bc4','#fff2d2','#d39c6b'],counter:['#f7c56a','#fff5d7','#aa7b4f'],warehouse:['#74889c','#d8e0e8','#8d735e'],vents:['#5e7184','#c6d0d9','#5d6974'],groom:['#8bd5cf','#f7ffff','#a9c5c0'],nightshop:['#263451','#4d5c86','#6f6257'],alley:['#50657a','#a9b9c5','#6d6259'],rooftop:['#6387a6','#c5d8e5','#725f57'],market:['#f0bb72','#fff0c9','#987457'],laundry:['#92bbda','#e9f5ff','#9ca8ad'],basement:['#4e5b55','#aeb9a6','#65594d'],sewer:['#4c6456','#a4b29d','#525b4c'],construction:['#e1aa5a','#f7dfb2','#8b7358'],park:['#75c88f','#dff5df','#6f9167'],sunset:['#ef8b72','#ffd6a6','#6a7452']};return m[t]||m.petshop}
function drawBackground(theme){const [a,b,c]=themePalette(theme),g=ctx.createLinearGradient(0,0,0,V.h);g.addColorStop(0,a);g.addColorStop(1,b);ctx.fillStyle=g;ctx.fillRect(0,0,V.w,V.h);ctx.fillStyle=c+'55';for(let x=-cameraX*.18%260-100;x<V.w;x+=260)ctx.fillRect(x,85,170,105)}
function drawDecor(d){const x=d.x-cameraX;if(x<-100||x>V.w+100)return;ctx.save();ctx.translate(x,d.y);const t=d.type,theme=d.theme;ctx.globalAlpha=.88;if(theme==='aquarium'&&t%3===0){ctx.fillStyle='#55c9e3aa';ctx.fillRect(-35,-28,70,55);ctx.strokeStyle='#e9ffff';ctx.strokeRect(-35,-28,70,55);ctx.font='20px system-ui';ctx.fillText('🐠',-10,5)}else if(theme==='toys'&&t%2===0){ctx.font='32px system-ui';ctx.fillText(t%4?'🧶':'🧸',-15,10)}else if(theme==='warehouse'){ctx.fillStyle='#c49a6c';ctx.fillRect(-30,-22,60,44);ctx.strokeStyle='#76583e';ctx.strokeRect(-30,-22,60,44)}else if(theme==='groom'){ctx.font='30px system-ui';ctx.fillText(t%2?'🧴':'🪮',-15,10)}else if(theme==='vents'){ctx.fillStyle='#70808d';ctx.fillRect(-32,-22,64,44);ctx.strokeStyle='#cbd3d8';for(let y=-15;y<18;y+=8){ctx.beginPath();ctx.moveTo(-25,y);ctx.lineTo(25,y);ctx.stroke()}}else if(theme==='nightshop'){ctx.fillStyle='#ffe46a88';ctx.beginPath();ctx.arc(0,0,18,0,7);ctx.fill()}else if(theme==='alley'){ctx.font='31px system-ui';ctx.fillText(t%3?'🗑️':'📦',-15,10)}else if(theme==='rooftop'){ctx.fillStyle='#5d6a72';ctx.fillRect(-24,-26,48,52);ctx.fillStyle='#333';ctx.fillRect(-18,-35,36,10)}else if(theme==='market'){ctx.font='31px system-ui';ctx.fillText(t%3?'🥕':'🧺',-15,10)}else if(theme==='laundry'){ctx.font='32px system-ui';ctx.fillText(t%2?'🧺':'🫧',-15,10)}else if(theme==='basement'||theme==='sewer'){ctx.font='28px system-ui';ctx.fillText(t%2?'🪣':'🕸️',-14,8)}else if(theme==='construction'){ctx.font='31px system-ui';ctx.fillText(t%2?'🚧':'🪜',-15,10)}else if(theme==='park'||theme==='sunset'){ctx.font='34px system-ui';ctx.fillText(t%3?'🌿':'🌳',-17,10)}else{ctx.font='30px system-ui';ctx.fillText(['🦴','🐾','🛍️','🪴','🧶','🥫','🐹'][t%7],-15,10)}ctx.restore()}
function drawPlatform(pl){const x=pl.x-cameraX;if(x>V.w+70||x+pl.w<-70)return;let top='#d7a871',side='#866142';if(['metal','beam'].includes(pl.type)){top='#bac5ce';side='#677480'}if(pl.type==='roof'){top='#8999a4';side='#515e67'}if(pl.type==='floor'){const theme=LEVELS[levelIndex][1],pal=themePalette(theme);ctx.fillStyle=pal[2];ctx.fillRect(x,pl.y,pl.w,pl.h);ctx.fillStyle='#00000020';ctx.fillRect(x,pl.y,pl.w,12);return}ctx.fillStyle=side;ctx.fillRect(x,pl.y,pl.w,pl.h);ctx.fillStyle=top;ctx.fillRect(x,pl.y,pl.w,6)}function drawHazard(h){const x=h.x-cameraX;ctx.fillStyle=h.type==='water'?'#59cce8aa':'#6f8b65aa';ctx.beginPath();ctx.ellipse(x+h.w/2,h.y+h.h/2,h.w/2,h.h/2,0,0,7);ctx.fill();ctx.font='17px system-ui';ctx.fillText(h.type==='water'?'💧':'🫧',x+h.w/2-8,h.y+10)}function drawPickup(it){if(it.taken)return;const x=it.x-cameraX,y=it.y+Math.sin(it.bob)*5;ctx.font='34px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(it.type==='key'?'🔑':it.type==='fish'?'🐟':'🐭',x,y)}function drawFinish(){const x=finishX-cameraX;if(x<-120||x>V.w+100)return;ctx.fillStyle='#4d3c2d';ctx.fillRect(x+32,382,18,238);ctx.fillStyle=levelIndex===19?'#4f9f5e':'#f5e58c';ctx.beginPath();ctx.arc(x+42,380,66,0,7);ctx.fill();ctx.font='42px system-ui';ctx.textAlign='center';ctx.fillText(levelIndex===19?'🌳':'🚪',x+42,390);ctx.font='800 13px system-ui';ctx.fillStyle='#1d2a33';ctx.fillText('ВЫХОД',x+42,450)}function drawCat(p,i){const x=p.x-cameraX,y=p.y;ctx.save();ctx.translate(x,y);ctx.strokeStyle=p.color;ctx.lineWidth=11;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(i?7:p.w-7,35);ctx.quadraticCurveTo(i?-22:p.w+22,20,i?-6:p.w+6,3);ctx.stroke();ctx.fillStyle=p.color;ctx.beginPath();ctx.roundRect(5,17,p.w-10,p.h-17,15);ctx.fill();ctx.beginPath();ctx.moveTo(7,18);ctx.lineTo(13,0);ctx.lineTo(24,16);ctx.moveTo(p.w-7,18);ctx.lineTo(p.w-13,0);ctx.lineTo(p.w-24,16);ctx.fill();ctx.fillStyle=p.accent;ctx.beginPath();ctx.ellipse(p.w/2,28,12,9,0,0,7);ctx.fill();ctx.fillStyle=p.face;ctx.beginPath();ctx.arc(16,20,3,0,7);ctx.arc(p.w-16,20,3,0,7);ctx.fill();ctx.fillStyle='#ef8999';ctx.beginPath();ctx.arc(p.w/2,27,2.5,0,7);ctx.fill();if(abilityStage(p)>=4&&p.shield){ctx.strokeStyle='#ffe56a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.w/2,p.h/2,34,0,7);ctx.stroke()}ctx.restore()}function drawDog(){if(!dog)return;const x=dog.x-cameraX,y=dog.y;ctx.save();ctx.translate(x,y);ctx.fillStyle='#8b5b36';ctx.beginPath();ctx.roundRect(8,19,84,52,18);ctx.fill();ctx.beginPath();ctx.arc(80,18,29,0,7);ctx.fill();ctx.fillStyle='#56351f';ctx.beginPath();ctx.ellipse(57,1,12,25,-.55,0,7);ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(87,15,4,0,7);ctx.arc(102,25,5,0,7);ctx.fill();ctx.font='800 12px system-ui';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('БАРБОС',58,90);ctx.restore()}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,SW,SH);ctx.save();ctx.translate(ox,oy);ctx.scale(fit,fit);const theme=LEVELS[levelIndex][1];drawBackground(theme);decor.forEach(drawDecor);platforms.forEach(drawPlatform);hazards.forEach(drawHazard);pickups.forEach(drawPickup);drawFinish();drawDog();players.forEach(drawCat);ctx.globalAlpha=.8;ctx.fillStyle='#17202bcc';ctx.fillRect(22,94,185,45);ctx.fillStyle='#fff';ctx.font='900 18px system-ui';ctx.textAlign='center';ctx.fillText(theme==='petshop'?'ЗООМИР 🐾':LEVELS[levelIndex][0].toUpperCase(),114,122);ctx.restore()}function loop(t){const dt=Math.min(.032,(t-last)/1000||.016);last=t;if(running){if(gameMode==='guest'){applyNet(dt);sendGuestInput()}else update(dt)}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function showWin(){menu.style.display='flex';roomBox.style.display='block';roomBox.innerHTML='<div class="roomCode" style="letter-spacing:0">🏆 СВОБОДА! 🏆</div><p><b>Рыжик и Дымка прошли все 20 уровней.</b><br>Барбос выдохся, а коты нашли свой парк.</p><button class="bigBtn" onclick="location.reload()">Сыграть снова</button>';meow(0);setTimeout(()=>meow(1),250)}
function setControlVisibility(){const c0=$('controls0'),c1=$('controls1');c0.classList.remove('right');c0.classList.add('left');c1.classList.remove('left');c1.classList.add('right');if(gameMode==='local'){c0.style.display='flex';c1.style.display='flex'}else if(gameMode==='host'){c0.style.display='flex';c1.style.display='none'}else{c0.style.display='none';c1.style.display='flex';c1.classList.remove('right');c1.classList.add('left')}}function startLocal(i=0){initAudio();gameMode='local';menu.style.display='none';setControlVisibility();running=true;loadLevel(i);last=performance.now()}$('localBtn').onclick=()=>startLocal(Math.min(unlocked-1,19));$('restartBtn').onclick=()=>{if(gameMode!=='guest')loadLevel(levelIndex)};$('menuBtn').onclick=()=>{running=false;menu.style.display='flex';roomBox.style.display='none'};
function makeCode(){return String(Math.floor(100000+Math.random()*900000))}function hostRoom(){initAudio();if(!window.Peer){showMsg('Не загрузился модуль онлайн-игры. Проверь интернет.',1800);return}roomCode=makeCode();roomBox.style.display='block';roomBox.innerHTML=`<div>Код комнаты</div><div class="roomCode">${roomCode}</div><div id="waitText">Ждём второго кота…</div>`;if(peer)try{peer.destroy()}catch(e){}peer=new Peer('two-cats-'+roomCode);peer.on('open',()=>{});peer.on('connection',c=>{conn=c;wireHost();$('waitText').textContent='Дымка подключилась!';setTimeout(()=>{gameMode='host';menu.style.display='none';setControlVisibility();onlineBadge.style.display='block';onlineBadge.textContent='🌐 Комната '+roomCode;running=true;loadLevel(Math.min(unlocked-1,19));last=performance.now()},450)});peer.on('error',e=>{$('waitText').textContent='Ошибка комнаты. Нажми «Создать» ещё раз.';console.error(e)})}function wireHost(){conn.on('data',d=>{if(d?.type==='input')remoteInput=d.input;else if(d?.type==='hello')sendState(true)});conn.on('close',()=>{showMsg('Второй игрок отключился',1800);remoteInput={move:0,jump:false,skill:false}})}function joinPrompt(){roomBox.style.display='block';roomBox.innerHTML=`<b>Введите 6-значный код с телефона папы</b><div class="joinRow"><input id="codeIn" inputmode="numeric" maxlength="6" placeholder="123456"><button id="doJoin" class="bigBtn blue">Войти</button></div><div id="joinStatus" class="smallText"></div>`;$('doJoin').onclick=joinRoom}function joinRoom(){initAudio();const code=$('codeIn').value.replace(/\D/g,'').slice(0,6);if(code.length!==6){$('joinStatus').textContent='Нужно 6 цифр';return}if(!window.Peer){$('joinStatus').textContent='Не загрузился модуль онлайн-игры';return}if(peer)try{peer.destroy()}catch(e){}peer=new Peer();$('joinStatus').textContent='Подключаемся…';peer.on('open',()=>{conn=peer.connect('two-cats-'+code,{reliable:true});conn.on('open',()=>{roomCode=code;gameMode='guest';conn.send({type:'hello'});menu.style.display='none';setControlVisibility();onlineBadge.style.display='block';onlineBadge.textContent='🌐 Комната '+roomCode;running=true;last=performance.now()});conn.on('data',receiveState);conn.on('close',()=>{showMsg('Связь с комнатой потеряна',2200);running=false})});peer.on('error',e=>{$('joinStatus').textContent='Не получилось войти. Проверь код.';console.error(e)})}$('hostBtn').onclick=hostRoom;$('joinBtn').onclick=joinPrompt;function sendGuestInput(){if(conn?.open)conn.send({type:'input',input:{move:input[1].move,jump:input[1].jump,skill:input[1].skill}})}function sendState(){if(!conn?.open)return;conn.send({type:'state',level:levelIndex,players:players.map(p=>({x:p.x,y:p.y,vx:p.vx,vy:p.vy,food:p.food,dashCd:p.dashCd,shield:p.shield,dir:p.dir})),taken:pickups.map(x=>x.taken),dog:dog?{x:dog.x,speed:dog.speed}:null,collected,keysGot,unlocked})}function receiveState(s){if(s?.type!=='state')return;if(s.level!==levelIndex||!platforms.length)loadLevel(s.level,true);netTarget=s;for(let i=0;i<s.taken.length&&i<pickups.length;i++)pickups[i].taken=s.taken[i];collected=s.collected;keysGot=s.keysGot;unlocked=Math.max(unlocked,s.unlocked||1);updateTask();if(s.dog&&dog){dog.x=s.dog.x;dog.speed=s.dog.speed}}function applyNet(dt){if(!netTarget)return;for(let i=0;i<2;i++){const t=netTarget.players[i],p=players[i];p.x+=(t.x-p.x)*Math.min(1,dt*14);p.y+=(t.y-p.y)*Math.min(1,dt*14);p.vx=t.vx;p.vy=t.vy;p.food=t.food;p.dashCd=t.dashCd;p.shield=t.shield;p.dir=t.dir}const center=(players[0].x+players[1].x)/2;cameraX+=(Math.max(0,Math.min(worldW-V.w,center-V.w*.43))-cameraX)*Math.min(1,dt*5);updateStats()}
$('levelsBtn').onclick=()=>{$('levelSelect').style.display=$('levelSelect').style.display==='grid'?'none':'grid'};function renderLevelSelect(){const box=$('levelSelect');box.innerHTML='';for(let i=0;i<20;i++){const b=document.createElement('button');b.className='lv'+(i+1>unlocked?' lock':'');b.textContent=i+1;b.disabled=i+1>unlocked;b.title=LEVELS[i][0];b.onclick=()=>startLocal(i);box.appendChild(b)}}renderLevelSelect();addEventListener('touchmove',e=>{if(running)e.preventDefault()},{passive:false});document.addEventListener('contextmenu',e=>e.preventDefault());loadLevel(0,true);draw();
})();
</script>

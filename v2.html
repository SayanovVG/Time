<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>MAX TIME v2</title><style>:root{--a:#c97a45;--bg:#1a1917;--card:#242220;--line:#3a3733;--txt:#f0ede8;--mut:#888884;--red:#d7473f;--orange:#e58b3a;--yellow:#d6b73d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Arial,sans-serif;padding-bottom:40px}button,input,select{font:inherit}.top{position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid #2a2825}.bar{padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:900;letter-spacing:2px}.sub{font-size:11px;color:var(--mut);margin-top:3px}.clock{font-size:25px}.tabs{display:grid;grid-template-columns:repeat(4,1fr)}.tab{padding:11px 3px;background:none;border:0;border-bottom:2px solid transparent;color:#666}.tab.on{color:var(--a);border-color:var(--a)}main{padding:14px;max-width:720px;margin:auto}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 14px}.day{padding:9px 2px;background:var(--card);border:1px solid var(--line);color:var(--mut)}.day.on{background:var(--a);color:white;border-color:var(--a)}h1{font-size:26px;color:var(--a);margin:12px 0 3px}.note{color:var(--mut);font-size:12px;margin-bottom:14px}.card{background:var(--card);border:1px solid #2e2c29;margin:10px 0;padding:12px;border-radius:4px}.exhead{display:flex;justify-content:space-between;gap:8px}.exname{font-weight:800;font-size:18px}.meta{font-size:12px;color:var(--mut);margin-top:4px}.tools{display:flex;gap:6px}.mini{background:#1a1917;border:1px solid var(--line);color:var(--a);padding:5px 8px}.hint{font-size:12px;color:#bbb;line-height:1.5;padding:9px 0}.set{display:grid;grid-template-columns:28px 1fr 1fr 74px 38px;gap:6px;align-items:center;border-top:1px solid #333;padding:8px 0}.set input,.set select{width:100%;background:#171615;color:white;border:1px solid var(--line);padding:7px}.check{height:34px;background:#171615;border:1px solid var(--line);color:#777}.check.on{background:var(--a);color:white}.rec{margin-top:8px;padding:8px;border:1px solid var(--a);color:var(--a);font-size:12px}.recovery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.recovery label{font-size:11px;color:var(--mut)}.recovery select{width:100%;margin-top:4px;background:#171615;color:white;border:1px solid var(--line);padding:7px}.muscleTabs{display:flex;gap:8px;margin-bottom:10px}.pill{padding:8px 12px;border:1px solid var(--line);background:var(--card);color:var(--mut)}.pill.on{border-color:var(--a);color:var(--a)}.legend{font-size:12px;color:var(--mut);line-height:1.8}.bodygrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.body{position:relative;background:var(--card);min-height:420px;border:1px solid #333;border-radius:6px;padding:10px}.bodytitle{text-align:center;color:var(--mut);font-size:12px}.m{position:absolute;border-radius:20px;background:#555;opacity:.9;cursor:pointer}.m.p1{background:var(--red)}.m.p2{background:var(--orange)}.m.p3{background:var(--yellow)}.head{width:45px;height:55px;left:calc(50% - 22px);top:35px;background:#555}.chestL,.chestR{width:50px;height:55px;top:105px}.chestL{left:calc(50% - 52px)}.chestR{left:calc(50% + 2px)}.deltL,.deltR{width:34px;height:42px;top:102px}.deltL{left:calc(50% - 85px)}.deltR{left:calc(50% + 51px)}.armL,.armR{width:28px;height:95px;top:145px}.armL{left:calc(50% - 82px)}.armR{left:calc(50% + 54px)}.core{width:75px;height:100px;top:162px;left:calc(50% - 37px)}.quadL,.quadR,.hamL,.hamR{width:43px;height:115px;top:268px}.quadL,.hamL{left:calc(50% - 46px)}.quadR,.hamR{left:calc(50% + 3px)}.back{width:105px;height:125px;top:105px;left:calc(50% - 52px)}.rearDeltL,.rearDeltR{width:34px;height:42px;top:102px}.rearDeltL{left:calc(50% - 85px)}.rearDeltR{left:calc(50% + 51px)}.gluteL,.gluteR{width:48px;height:55px;top:232px}.gluteL{left:calc(50% - 50px)}.gluteR{left:calc(50% + 2px)}.detail{margin-top:12px}.stat{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid #333}.big{font-size:28px;color:var(--a);font-weight:800}.empty{padding:30px;text-align:center;color:var(--mut)}a{color:var(--a)}@media(max-width:520px){.set{grid-template-columns:25px 1fr 1fr 64px 34px}.bodygrid{grid-template-columns:1fr}.body{min-height:410px}}</style></head><body><div id="app"></div><script>'use strict';

{id:'facepull',n:'Face Pull с резинкой',s:3,min:12,max:20,r:2,rest:60,band:true,m:{rearDelt:1,traps:2,rhomboids:2,rotator:2},h:'Тяни резинку к лицу, локти высоко, в конце разворачивай кисти назад и своди лопатки.',v:'https://www.youtube.com/watch?v=PYj77in44ms'},

const MN={chest:'Грудь',upperChest:'Верх груди',frontDelt:'Передняя дельта',sideDelt:'Средняя дельта',rearDelt:'Задняя дельта',biceps:'Бицепс',brachialis:'Brachialis',triceps:'Трицепс',forearms:'Предплечья',lats:'Широчайшие',traps:'Трапеции',rhomboids:'Ромбовидные',erectors:'Разгибатели спины',quads:'Квадрицепс',hamstrings:'Задняя поверхность бедра',glutes:'Большая ягодичная',gluteMed:'Средняя ягодичная',adductors:'Приводящие',calves:'Икры',abs:'Прямая мышца живота',obliques:'Косые',core:'Глубокий core',rotator:'Ротаторная манжета'};
let S=JSON.parse(localStorage.getItem('mt_v2')||'null')||{tab:'training',day:1,sets:{},recovery:{sleep:3,feel:3,sore:3},muscleMode:'today',muscleSel:null};function save(){localStorage.setItem('mt_v2',JSON.stringify(S))}function k(ex,i){return new Date().toISOString().slice(0,10)+'_'+ex.id+'_'+i}function sd(ex,i){return S.sets[k(ex,i)]||{load:'',rep:'',rir:'',done:false}}function upd(ex,i,f,v){const q=k(ex,i);S.sets[q]=sd(ex,i);S.sets[q][f]=v;save()}function done(ex,i){const q=k(ex,i);S.sets[q]=sd(ex,i);S.sets[q].done=!S.sets[q].done;save();render()}function ready(ex){let a=[];for(let i=0;i<ex.s;i++)a.push(sd(ex,i));return a.length&&a.every(x=>x.done&&+x.rep>=ex.max&&x.rir!==''&&+x.rir<=ex.r)}function mus(mode){const out={};const days=mode==='today'?[S.day]:[1,2,3,4,5];days.forEach(d=>P[d].ex.forEach(e=>Object.entries(e.m).forEach(([m,p])=>{if(!out[m])out[m]={p,sets:0,ex:[]};out[m].p=Math.min(out[m].p,p);out[m].sets+=e.s*(p===1?1:p===2?.5:.25);if(!out[m].ex.includes(e.n))out[m].ex.push(e.n)})));return out}function mc(m,map){return map[m]?'p'+map[m].p:''}function body(front,map){const z=front?[['chest','chestL'],['chest','chestR'],['frontDelt','deltL'],['frontDelt','deltR'],['biceps','armL'],['biceps','armR'],['abs','core'],['quads','quadL'],['quads','quadR']]:[['lats','back'],['rearDelt','rearDeltL'],['rearDelt','rearDeltR'],['triceps','armL'],['triceps','armR'],['glutes','gluteL'],['glutes','gluteR'],['hamstrings','hamL'],['hamstrings','hamR']];return `<div class="body"><div class="bodytitle">${front?'СПЕРЕДИ':'СЗАДИ'}</div><div class="m head"></div>${z.map(([m,c])=>`<div title="${MN[m]}" onclick="S.muscleSel='${m}';render()" class="m ${c} ${mc(m,map)}"></div>`).join('')}</div>`}function training(){const w=P[S.day];let h=`<div class="days">${[1,2,3,4,5].map(d=>`<button class="day ${d===S.day?'on':''}" onclick="S.day=${d};save();render()">${['','ПН','ВТ','СР','ЧТ','ПТ'][d]}</button>`).join('')}</div><h1>${w.n}</h1><div class="note">${w.note}${w.mma?' · MMA вечером':''}</div><div class="card"><b>ВОССТАНОВЛЕНИЕ</b><div class="recovery">${[['sleep','Сон'],['feel','Самочувствие'],['sore','Забитость']].map(([x,n])=>`<label>${n}<select onchange="S.recovery.${x}=+this.value;save()">${[1,2,3,4,5].map(v=>`<option ${S.recovery[x]===v?'selected':''}>${v}</option>`).join('')}</select></label>`).join('')}</div>${(S.recovery.sleep+S.recovery.feel+(6-S.recovery.sore)<7)?'<div class="rec">⚠ Восстановление ниже обычного — сегодня не работать до отказа.</div>':''}</div>`;w.ex.forEach(ex=>{h+=`<div class="card"><div class="exhead"><div><div class="exname">${ex.n}</div><div class="meta">${ex.s} × ${ex.min}–${ex.max}${ex.time?' сек':' повт'} · RIR ${ex.r} · отдых ${ex.rest}с</div></div><div class="tools"><button class="mini" onclick="this.closest('.card').querySelector('.hint').hidden^=1">?</button>${ex.v?`<button class="mini" onclick="window.open('${ex.v}','_blank')">▶</button>`:''}</div></div><div class="hint" hidden>${ex.h}</div>${Array.from({length:ex.s},(_,i)=>{const x=sd(ex,i);return `<div class="set"><span>S${i+1}</span>${ex.band?`<select onchange="upd(P[S.day].ex.find(e=>e.id==='${ex.id}'),${i},'load',this.value)"><option value="">резинка</option>${BANDS.map(b=>`<option ${x.load===b?'selected':''}>${b}</option>`).join('')}</select>`:`<input placeholder="кг" value="${x.load}" onchange="upd(P[S.day].ex.find(e=>e.id==='${ex.id}'),${i},'load',this.value)">`}<input inputmode="numeric" placeholder="${ex.time?'сек':'повт'}" value="${x.rep}" onchange="upd(P[S.day].ex.find(e=>e.id==='${ex.id}'),${i},'rep',this.value)"><select onchange="upd(P[S.day].ex.find(e=>e.id==='${ex.id}'),${i},'rir',this.value)"><option value="">RIR</option>${[0,1,2,3].map(v=>`<option value="${v}" ${String(x.rir)===String(v)?'selected':''}>${v===3?'3+':v}</option>`).join('')}</select><button class="check ${x.done?'on':''}" onclick="done(P[S.day].ex.find(e=>e.id==='${ex.id}'),${i})">✓</button></div>`}).join('')}${ready(ex)?'<div class="rec">↑ ГОТОВ К УВЕЛИЧЕНИЮ НАГРУЗКИ НА СЛЕДУЮЩЕЙ ТРЕНИРОВКЕ</div>':''}</div>`});return h}function muscles(){const map=mus(S.muscleMode);const sel=S.muscleSel&&map[S.muscleSel];return `<h1>КАРТА МЫШЦ</h1><div class="muscleTabs"><button class="pill ${S.muscleMode==='today'?'on':''}" onclick="S.muscleMode='today';render()">СЕГОДНЯ</button><button class="pill ${S.muscleMode==='week'?'on':''}" onclick="S.muscleMode='week';render()">НЕДЕЛЯ</button></div><div class="legend">Красный — основная · оранжевый — вторичная · жёлтый — стабилизация</div><div class="bodygrid">${body(true,map)}${body(false,map)}</div>${S.muscleSel?`<div class="card detail"><div class="exname">${MN[S.muscleSel]}</div>${sel?`<div class="big">${Math.round(sel.sets*10)/10}</div><div class="note">условных рабочих подходов (${sel.p===1?'основная':sel.p===2?'вторичная':'стабилизирующая'} роль)</div><div>${sel.ex.join(' · ')}</div>`:'<div class="note">В выбранном режиме прямой нагрузки нет.</div>'}</div>`:''}`}function progress(){let completed=Object.values(S.sets).filter(x=>x.done).length;let recs=[];Object.values(P).flatMap(x=>x.ex).forEach(ex=>{let best=0;Object.entries(S.sets).forEach(([kk,v])=>{if(kk.includes('_'+ex.id+'_')&&v.done)best=Math.max(best,+v.rep||0)});if(best)recs.push([ex.n,best])});return `<h1>ПРОГРЕСС</h1><div class="card"><div class="stat"><span>Выполнено подходов в журнале</span><b>${completed}</b></div><div class="stat"><span>Текущая схема</span><b>5 дней</b></div><div class="stat"><span>MMA</span><b>ПН · СР · ПТ</b></div></div><div class="card"><div class="exname">ЛИЧНЫЕ РЕКОРДЫ ПО ПОВТОРАМ</div>${recs.length?recs.map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join(''):'<div class="empty">Появятся после первых тренировок.</div>'}</div>`}function nutrition(){return `<h1>ПИТАНИЕ</h1><div class="card"><div class="exname">Раздел пока не меняем</div><div class="note">По утверждённому ТЗ питание будет перенесено после отдельного разбора фактического рациона и КБЖУ.</div></div>`}function render(){const tabs=[['training','ТРЕНИРОВКИ'],['muscles','МЫШЦЫ'],['nutrition','ПИТАНИЕ'],['progress','ПРОГРЕСС']];document.getElementById('app').innerHTML=`<div class="top"><div class="bar"><div><div class="brand">MAX TIME</div><div class="sub">v2 · СИЛА · МЫШЦЫ · MMA</div></div><div id="clock" class="clock"></div></div><div class="tabs">${tabs.map(t=>`<button class="tab ${S.tab===t[0]?'on':''}" onclick="S.tab='${t[0]}';save();render()">${t[1]}</button>`).join('')}</div></div><main>${S.tab==='training'?training():S.tab==='muscles'?muscles():S.tab==='progress'?progress():nutrition()}</main>`;tick()}function tick(){const e=document.getElementById('clock');if(e)e.textContent=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}setInterval(tick,1000);render();</script></body></html>
